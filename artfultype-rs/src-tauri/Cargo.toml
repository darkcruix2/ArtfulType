[package]
name = "artfultype-rs"
version = "0.26.3"
description = "ArtfulType — distraction-free Markdown writer & TUI editor"
authors = ["you"]
edition = "2021"

[package.metadata.deb]
name = "artfultype-cli"
section = "editors"
priority = "optional"
depends = ""
maintainer = "ArtfulType <artfultype@space.mil>"
extended-description = "ArtfulType CLI is a distraction-free Markdown TUI editor for Linux terminals.\nSupports Writer, Markdown and Split view modes; Shift-selection, cut/copy/paste,\nbold/italic/code wrapping, multiple colour themes, and VT100/ASCII mode."
assets = [
  ["target/release/artfultype-cli", "usr/bin/artfultype-cli", "755"],
]

[package.metadata.generate-rpm]
name = "artfultype-cli"
summary = "ArtfulType CLI \u2014 distraction-free Markdown TUI editor"
description = """ArtfulType CLI is a terminal TUI editor for Markdown files.
Supports Writer/Markdown/Split view modes, Shift-selection, cut/copy/paste,
bold/italic/code wrapping, multiple colour themes, and VT100/ASCII mode."""
license = "GPL-3.0"

[[package.metadata.generate-rpm.assets]]
source = "target/release/artfultype-cli"
dest = "/usr/bin/artfultype-cli"
mode = "0755"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "artfultype_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "artfultype-rs"
path = "src/main.rs"

[[bin]]
name = "artfultype-cli"
path = "src/cli_main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13.4"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
base64 = "0.22"
ratatui = "0.29.0"
crossterm = "0.28.1"



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
