<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtfulType Pro</title>
    <meta name="description" content="ArtfulType Pro — a beautiful Dracula-themed Markdown editor with Writer and Markdown modes." />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- ── Application Header ──────────────────────────────────── -->
      <header id="app-header" class="glass-panel">
        <div class="header-left">
          <button id="main-menu-btn" class="icon-btn" title="Main Menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
        <div class="header-center">
          <span class="app-title">ArtfulType Pro <span class="app-version">v0.1.0</span></span>
        </div>
        <div class="header-right"></div>
      </header>

      <div id="app-body">
        <!-- ── Sidebar ─────────────────────────────────────────────── -->
      <nav id="sidebar" class="glass-panel">
        <div class="sidebar-header">
          <h2>Recent Files</h2>
          <div class="sidebar-actions">
            <button id="new-file-btn"  class="icon-btn" title="New File (Ctrl+N)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button id="open-file-btn" class="icon-btn" title="Open File (Ctrl+O)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"/></svg>
            </button>
            <button id="save-file-btn" class="icon-btn" title="Save File (Ctrl+S)">
              <!-- Floppy disk: filled when dirty, outlined when clean -->
              <svg id="save-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            </button>
          </div>
        </div>
        <ul id="file-list">
          <!-- Populated dynamically by main.js -->
        </ul>
      </nav>

      <!-- ── Editor ──────────────────────────────────────────────── -->
      <main id="editor-container">

        <!-- Toolbar -->
        <header id="toolbar" class="glass-panel">

          <!-- Undo / Redo -->
          <div class="toolbar-group" id="history-group">
            <button id="undo-btn" class="icon-btn" title="Undo (Ctrl+Z)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13C5.4 7.6 11 4 17 4a9 9 0 0 1 9 9"/></svg>
            </button>
            <button id="redo-btn" class="icon-btn" title="Redo (Ctrl+Y)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M21 13C18.6 7.6 13 4 7 4a9 9 0 0 0-9 9"/></svg>
            </button>
          </div>

          <div class="toolbar-sep"></div>

          <!-- Format -->
          <div class="toolbar-group" id="fmt-group">
            <button id="bold-btn"   class="icon-btn fmt-btn" title="Bold (Ctrl+B)"><strong>B</strong></button>
            <button id="italic-btn" class="icon-btn fmt-btn" title="Italic (Ctrl+I)"><em>I</em></button>
            <button id="code-btn"   class="icon-btn fmt-btn" title="Code (Ctrl+K)"><span class="mono">{}</span></button>
          </div>

          <div class="toolbar-sep"></div>

          <!-- Headings H1–H6 -->
          <div class="toolbar-group" id="heading-group">
            <button id="h1-btn" class="icon-btn fmt-btn h-btn" title="Heading 1 (Ctrl+1)">H1</button>
            <button id="h2-btn" class="icon-btn fmt-btn h-btn" title="Heading 2 (Ctrl+2)">H2</button>
            <button id="h3-btn" class="icon-btn fmt-btn h-btn" title="Heading 3 (Ctrl+3)">H3</button>
            <button id="h4-btn" class="icon-btn fmt-btn h-btn" title="Heading 4 (Ctrl+4)">H4</button>
            <button id="h5-btn" class="icon-btn fmt-btn h-btn" title="Heading 5 (Ctrl+5)">H5</button>
            <button id="h6-btn" class="icon-btn fmt-btn h-btn" title="Heading 6 (Ctrl+6)">H6</button>
          </div>

          <div class="toolbar-sep"></div>

          <!-- Lists -->
          <div class="toolbar-group" id="list-group">
            <button id="ul-btn" class="icon-btn fmt-btn" title="Unordered List">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
            </button>
            <button id="ol-btn" class="icon-btn fmt-btn" title="Ordered List">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="1" y="8" font-size="7" fill="currentColor" stroke="none">1.</text><text x="1" y="14" font-size="7" fill="currentColor" stroke="none">2.</text><text x="1" y="20" font-size="7" fill="currentColor" stroke="none">3.</text></svg>
            </button>
            <button id="cb-btn" class="icon-btn fmt-btn" title="Checkbox List">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7" height="7" rx="1"/><polyline points="5 9 7 11 9 7"/><line x1="13" y1="9" x2="21" y2="9"/><rect x="3" y="15" width="7" height="7" rx="1"/><line x1="13" y1="19" x2="21" y2="19"/></svg>
            </button>
          </div>

          <div class="toolbar-sep"></div>

          <!-- Block elements -->
          <div class="toolbar-group" id="block-group">
            <button id="quote-btn" class="icon-btn fmt-btn" title="Blockquote (Ctrl+Q)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
            </button>
            <button id="hr-btn" class="icon-btn fmt-btn" title="Horizontal Rule">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/></svg>
            </button>
          </div>

          <div class="toolbar-sep"></div>

          <!-- Insert -->
          <div class="toolbar-group" id="insert-group">
            <button id="time-btn" class="icon-btn fmt-btn" title="Insert Time (Ctrl+Alt+T)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </button>
            <button id="date-btn" class="icon-btn fmt-btn" title="Insert Date (Ctrl+Alt+D)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
          </div>

          <div class="toolbar-spacer"></div>

          <div class="toolbar-group">
            <button id="toggle-mode-btn" class="btn primary-btn">Markdown Mode</button>
          </div>
        </header>

        <!-- Editor area -->
        <div id="editor-area">
          <textarea id="markdown-input" placeholder="Start writing here…" spellcheck="true"></textarea>
          <div id="writer-view" class="hidden" contenteditable="true" spellcheck="true"></div>
        </div>

        <!-- Status bar -->
        <footer id="status-bar" class="glass-panel">
          <div class="status-left">
            <span id="status-message">Ready</span>
          </div>
          <div class="status-right">
            <span id="mode-indicator">Writer Mode</span>
            <span id="word-count">0 words</span>
            <span id="char-count">0 chars</span>
          </div>
        </footer>

      </main>
      </div> <!-- End app-body -->
    </div> <!-- End app -->

    <!-- Main Dropdown Menu -->
    <div id="main-menu" class="dropdown-menu hidden">
      <button id="menu-about-btn" class="menu-item">About</button>
      <button id="menu-prefs-btn" class="menu-item">Preferences</button>
    </div>

    <!-- About Modal -->
    <dialog id="about-modal" class="modal-dialog glass-panel">
      <div class="modal-content">
        <h2>About ArtfulType Pro</h2>
        <p class="version-text">Version 0.1.0</p>
        <hr class="modal-sep" />
        <p><strong>License:</strong> GPLv3</p>
        <p><strong>Maintainer:</strong> Roland Huber</p>
        <p><strong>Original Creator:</strong> Sean Malseed (Action Retro)</p>
        <div class="modal-actions">
          <button id="close-about-btn" class="btn primary-btn">Close</button>
        </div>
      </div>
    </dialog>

    <!-- Preferences Modal -->
    <dialog id="prefs-modal" class="modal-dialog glass-panel">
      <div class="modal-content">
        <h2>Preferences</h2>
        <hr class="modal-sep" />
        
        <div class="pref-row">
          <label for="autosave-select">Auto-save interval:</label>
          <select id="autosave-select" class="pref-select">
            <option value="0">Off</option>
            <option value="1">1 minute</option>
            <option value="2">2 minutes</option>
            <option value="5">5 minutes</option>
            <option value="10">10 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
          </select>
        </div>

        <div class="modal-actions">
          <button id="close-prefs-btn" class="btn primary-btn">Close</button>
        </div>
      </div>
    </dialog>

  </body>
</html>
