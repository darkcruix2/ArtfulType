<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtfulType Pro</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="app">
      <nav id="sidebar" class="glass-panel">
        <div class="sidebar-header">
          <h2>Files</h2>
          <div class="sidebar-actions">
            <button id="open-file-btn" class="icon-btn" title="Open File">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"></path></svg>
            </button>
            <button id="save-file-btn" class="icon-btn" title="Save File (Ctrl+S)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            </button>
            <button id="new-file-btn" class="icon-btn" title="New File (Ctrl+N)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
        <ul id="file-list">
          <li class="file-item active" data-id="untitled.md">untitled.md</li>
        </ul>
      </nav>

      <main id="editor-container">
        <header id="toolbar" class="glass-panel">
          <div class="toolbar-group">
            <button class="icon-btn" title="Bold (Ctrl+B)">B</button>
            <button class="icon-btn" title="Italic (Ctrl+I)">I</button>
            <button class="icon-btn" title="Code (Ctrl+K)">{'}'}</button>
          </div>
          <div class="toolbar-group">
            <button class="icon-btn" title="Heading 1 (Ctrl+1)">H1</button>
            <button class="icon-btn" title="Heading 2 (Ctrl+2)">H2</button>
            <button class="icon-btn" title="Heading 3 (Ctrl+3)">H3</button>
          </div>
          <div class="toolbar-spacer"></div>
          <div class="toolbar-group">
            <button id="toggle-mode-btn" class="btn primary-btn">Markdown Mode</button>
          </div>
        </header>

        <div id="editor-area">
          <textarea id="markdown-input" placeholder="Start writing here..."></textarea>
          <div id="writer-view" class="hidden"></div>
        </div>

        <footer id="status-bar" class="glass-panel">
          <div class="status-left">
            <span id="status-message">Ready</span>
          </div>
          <div class="status-right">
            <span id="word-count">0 words</span>
            <span id="char-count">0 chars</span>
          </div>
        </footer>
      </main>
    </div>
  </body>
</html>
